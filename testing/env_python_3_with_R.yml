name: python_3_with_R
channels:
  - conda-forge
dependencies:
  - python=3
  - grpcio
  # Pin to latest protoc 21.x, which is also used in zeppelin with verion 3.21
  - protobuf=4.21
  - ipython
  - ipykernel
  - jupyter_client
  # used in PythonInterpreterPandasSqlTestTest
  - pandasql
  # some plotting libs used in IPythonInterpreterTest
  - matplotlib
  - bokeh
  - hvplot
## R-Packages
  - r-base
  - r-irkernel
  # Used in IRKernelTest
  - r-ggplot2
  # Used in IRKernelTest
  - r-googlevis
  # Used in RInterpreterTest
  - r-knitr
  # Used in ShinyInterpreterTest
  - r-shiny
  # Used in SparkIntegrationTest
  - r-markdown
